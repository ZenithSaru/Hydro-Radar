name: Hydrology Radar - Command Poller

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler doesn't guarantee exact timing —
    # actual delay is often longer, especially on the free tier. Commands
    # aren't instant; expect a reply within roughly 15-30 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # trigger manually if you don't want to wait

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll Telegram for commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python process_commands.py

      - name: Commit updated database
        run: |
          git config user.name "hydrology-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add radar.db
          git diff --staged --quiet || git commit -m "Process Telegram commands [skip ci]"
          # Pull-rebase before pushing in case the daily ingestion workflow
          # committed in between this job starting and finishing.
          git pull --rebase origin main || true
          git push
