<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hydrology Opportunity Radar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1720; --panel: #17212b; --text: #e6edf3; --muted: #8b98a5;
    --accent: #4fb3d9; --border: #2a3742; --good: #4caf7d; --warn: #d9a24f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 24px 28px 8px; }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .sub { color: var(--muted); font-size: 0.9rem; }
  nav { display: flex; gap: 6px; padding: 16px 28px 0; flex-wrap: wrap; }
  nav button { background: var(--panel); color: var(--text); border: 1px solid var(--border);
               padding: 8px 14px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 0.9rem; }
  nav button.active { background: var(--accent); color: #06222c; border-color: var(--accent); }
  main { padding: 0 28px 40px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin: 16px 0; }
  input[type=search] { flex: 1; max-width: 340px; background: var(--panel); border: 1px solid var(--border);
                        color: var(--text); padding: 9px 12px; border-radius: 8px; font-size: 0.9rem; }
  .grid { display: grid; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card h3 { margin: 0 0 6px; font-size: 1rem; }
  .card .meta { color: var(--muted); font-size: 0.82rem; margin-bottom: 8px; }
  .card p { margin: 0; font-size: 0.88rem; line-height: 1.4; color: #c7d1da; }
  .score { display: inline-block; background: rgba(79,179,217,0.15); color: var(--accent);
           border-radius: 6px; padding: 1px 8px; font-weight: 600; font-size: 0.8rem; margin-right: 8px; }
  .ref { display: inline-block; color: var(--muted); font-size: 0.8rem; margin-right: 8px; }
  .badge { display: inline-block; border-radius: 6px; padding: 1px 8px; font-weight: 600; font-size: 0.78rem; margin-right: 8px; text-transform: capitalize; }
  .badge-new { background: rgba(139,152,165,0.18); color: var(--muted); }
  .badge-interested { background: rgba(79,179,217,0.18); color: var(--accent); }
  .badge-applied { background: rgba(217,162,79,0.18); color: var(--warn); }
  .badge-interview { background: rgba(217,162,79,0.28); color: var(--warn); }
  .badge-offer { background: rgba(76,175,125,0.2); color: var(--good); }
  .badge-rejected { background: rgba(217,79,79,0.18); color: #d94f4f; }
  .badge-skip { background: rgba(139,152,165,0.1); color: var(--muted); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { color: var(--muted); font-size: 0.78rem; padding: 20px 28px 40px; }
</style>
</head>
<body>

<header>
  <h1>🌊 Hydrology Opportunity Radar</h1>
  <div class="sub" id="generated-at">Loading…</div>
</header>

<nav id="tabs"></nav>

<main>
  <div class="toolbar">
    <input type="search" id="search" placeholder="Filter by keyword, institution, PI…">
  </div>
  <div class="grid" id="results"></div>
</main>

<footer>Generated automatically by the Hydrology Opportunity Radar pipeline (GitHub Actions). Data refreshes on each scheduled run.</footer>

<script>
const TABS = [
  { key: "pipeline", label: "Pipeline", render: renderPipeline },
  { key: "opportunities", label: "Opportunities", render: renderOpportunity },
  { key: "recruitment_signals", label: "Recruiting Professors", render: renderSignal },
  { key: "awards", label: "Funding Analytics", render: renderAward },
  { key: "faculty", label: "Faculty Pages", render: renderFaculty },
  { key: "discovered_urls", label: "Google Discovery", render: renderDiscovered },
];

let DATA = null;
let activeTab = TABS[0].key;

fetch("data.json?_=" + Date.now())
  .then(r => r.json())
  .then(data => { DATA = data; init(); })
  .catch(() => {
    document.getElementById("results").innerHTML =
      '<div class="empty">No data.json yet — run the pipeline at least once.</div>';
    document.getElementById("generated-at").textContent = "";
  });

function init() {
  document.getElementById("generated-at").textContent =
    "Last updated: " + new Date(DATA.generated_at).toLocaleString();

  const tabsEl = document.getElementById("tabs");
  TABS.forEach(t => {
    const btn = document.createElement("button");
    btn.textContent = `${t.label} (${(DATA[t.key] || []).length})`;
    btn.onclick = () => { activeTab = t.key; refresh(); updateActive(); };
    btn.dataset.key = t.key;
    tabsEl.appendChild(btn);
  });
  updateActive();
  document.getElementById("search").addEventListener("input", refresh);
  refresh();
}

function updateActive() {
  document.querySelectorAll("#tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.key === activeTab));
}

function refresh() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const tab = TABS.find(t => t.key === activeTab);
  const rows = (DATA[activeTab] || []).filter(r =>
    !q || JSON.stringify(r).toLowerCase().includes(q));

  const el = document.getElementById("results");
  el.innerHTML = "";
  if (!rows.length) {
    el.innerHTML = '<div class="empty">Nothing here yet.</div>';
    return;
  }
  rows.forEach(r => el.appendChild(tab.render(r)));
}

function card(scoreVal, titleHtml, metaHtml, bodyText, linkUrl) {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <h3>${scoreVal !== undefined ? `<span class="score">${scoreVal}</span>` : ""}${titleHtml}</h3>
    <div class="meta">${metaHtml}</div>
    ${bodyText ? `<p>${bodyText}</p>` : ""}
    ${linkUrl ? `<p style="margin-top:8px"><a href="${linkUrl}" target="_blank" rel="noopener">Open ↗</a></p>` : ""}
  `;
  return div;
}

function esc(s) { return (s || "").toString().replace(/</g, "&lt;"); }

function renderPipeline(p) {
  const div = document.createElement("div");
  div.className = "card";
  const notes = p.notes ? `<p style="margin-top:6px">📝 ${esc(p.notes)}</p>` : "";
  div.innerHTML = `
    <h3><span class="ref">#${p.ref_id}</span><span class="badge badge-${esc(p.status)}">${esc(p.status)}</span>${esc(p.title)}</h3>
    <div class="meta">${esc(p.institution) || ""} ${p.pi_name ? "· PI: " + esc(p.pi_name) : ""} · source: ${esc(p.source_type)} · updated ${esc(p.updated_at)}</div>
    ${p.summary ? `<p>${esc(p.summary).slice(0, 220)}</p>` : ""}
    ${notes}
    <p style="margin-top:8px">${p.url ? `<a href="${p.url}" target="_blank" rel="noopener">Open ↗</a> · ` : ""}<span style="color:var(--muted)">reply <code>/draft ${p.ref_id}</code> or <code>/status ${p.ref_id} &lt;status&gt;</code> on Telegram</span></p>
  `;
  return div;
}

function renderOpportunity(o) {
  return card(o.score, esc(o.title), `${esc(o.institution)} ${o.position_type ? "· " + esc(o.position_type) : ""} · matched: ${esc(o.matched_kw)}`,
              esc(o.summary).slice(0, 220), o.post_url);
}
function renderSignal(s) {
  return card(s.recruiting_score, esc(s.pi_name),
              `${esc(s.institution)} · award $${Number(s.amount_usd).toLocaleString()} on ${esc(s.award_date)}` +
              (s.publication_count != null ? ` · ${s.publication_count} recent pubs` : ""),
              "", `https://www.nsf.gov/awardsearch/showAward?AWD_ID=${s.award_id}`);
}
function renderAward(a) {
  return card(a.score, esc(a.title), `${esc(a.institution)} · PI: ${esc(a.pi_name)} · $${Number(a.amount_usd).toLocaleString()} · ${esc(a.awarded_date)} · matched: ${esc(a.matched_kw)}`,
              esc(a.abstract).slice(0, 220), a.url);
}
function renderFaculty(f) {
  return card(undefined, esc(f.page_title || f.source_url),
              `matched: ${esc(f.matched_kw)} · emails: ${esc(f.emails) || "none"} · last changed: ${esc(f.last_changed)}`,
              "", f.source_url);
}
function renderDiscovered(d) {
  return card(d.score, esc(d.title), `matched: ${esc(d.matched_kw)} · query: ${esc(d.query)}`,
              esc(d.snippet), d.url);
}
</script>
</body>
</html>
